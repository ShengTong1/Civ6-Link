name: build-civlink
on: [push, workflow_dispatch]

jobs:
  agent:
    name: Agent (civlink-agent.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.75.0
        shell: pwsh
        run: rustup toolchain install 1.75.0 --profile minimal
      - name: Diagnostics
        shell: pwsh
        working-directory: civlink/agent
        run: |
          $rustc = (rustup run 1.75.0 rustc --version 2>&1) -join ' '
          $cargo = (rustup run 1.75.0 cargo --version 2>&1) -join ' '
          $vendorFiles = (Get-ChildItem vendor -Recurse -File | Measure-Object).Count
          Write-Output "::notice::rustc=$rustc"
          Write-Output "::notice::cargo=$cargo"
          Write-Output "::notice::vendor files=$vendorFiles"
      - name: Build agent (vendored deps, offline)
        shell: pwsh
        working-directory: civlink/agent
        run: |
          $log = 'build-out.txt'
          & rustup run 1.75.0 cargo build --release --features peer-discover --target-dir target-175 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = (Select-String -Path $log -Pattern '^error' -SimpleMatch:$false | Select-Object -First 6 | ForEach-Object { $_.Line })
            if (-not $errs) { $errs = Get-Content $log -Tail 6 }
            Write-Output ("::error::cargo build exit " + $code + " : " + (($errs -join ' | ') -replace '"', "'"))
            exit $code
          }
      - name: Run core selftest
        shell: pwsh
        working-directory: civlink/agent
        run: |
          .\target-175\release\civlink-agent.exe --peer-discover-selftest
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::selftest failed"; exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: civlink-agent
          path: civlink/agent/target-175/release/civlink-agent.exe
          if-no-files-found: error

  gui:
    name: GUI (civlink-gui.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build Tauri GUI
        working-directory: civlink/gui-tauri/src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: civlink-gui
          path: civlink/gui-tauri/src-tauri/target/release/civlink-gui.exe
          if-no-files-found: error
