name: build-civlink
on: [push, workflow_dispatch]

jobs:
  agent:
    name: Agent (civlink-agent.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - name: Build agent (vendored deps, offline)
        working-directory: civlink/agent
        run: cargo build --release --features peer-discover --target-dir target-175
      - name: Run core selftest
        working-directory: civlink/agent
        run: .\target-175\release\civlink-agent.exe --peer-discover-selftest
      - uses: actions/upload-artifact@v4
        with:
          name: civlink-agent
          path: civlink/agent/target-175/release/civlink-agent.exe
          if-no-files-found: error

  gui:
    name: GUI (civlink-gui.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build Tauri GUI
        working-directory: civlink/gui-tauri/src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: civlink-gui
          path: civlink/gui-tauri/src-tauri/target/release/civlink-gui.exe
          if-no-files-found: error
